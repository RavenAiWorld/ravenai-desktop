name: Build & Publish Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update or create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - label: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          npm ci
          npm --prefix studio/frontend ci

      - name: Run frontend checks & unit tests
        run: |
          npm run check
          npm --prefix studio/frontend run studio:typecheck
          npm test

      - name: Generate release source archive
        shell: bash
        run: git archive --format=zip -o release-source.zip HEAD

      - name: Run Rust library tests
        if: matrix.label != 'macos-x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri bundle (${{ matrix.target }})
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Collect installer & SHA256
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${{ matrix.bundle }}" = "dmg" ]; then
            FILE=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
            test -n "$FILE"
            cp "$FILE" release-artifacts/
            BASENAME=$(basename "$FILE")
            (cd release-artifacts && shasum -a 256 "$BASENAME" > "${BASENAME}.sha256")
          else
            FILE=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -maxdepth 1 -name '*-setup.exe' | head -n 1)
            test -n "$FILE"
            cp "$FILE" release-artifacts/
            BASENAME=$(basename "$FILE")
            (cd release-artifacts && sha256sum "$BASENAME" > "${BASENAME}.sha256")
          fi
          ls -la release-artifacts/
          cat release-artifacts/*.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist-release

      - name: Assemble unified SHA256SUMS.txt
        run: |
          cd dist-release
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la
          cat SHA256SUMS.txt

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GH_REPO" dist-release/* --clobber
          else
            gh release create "$TAG" -R "$GH_REPO" dist-release/* --title "Ravenai Desktop $TAG" --latest
          fi
          python3 - "$TAG" <<'PY'
          import pathlib, sys
          tag = sys.argv[1]
          sums = pathlib.Path("dist-release/SHA256SUMS.txt").read_text().strip()
          notes = (
              f"Ravenai Desktop v1.00 ({tag}) · Windows & macOS 全平台正式版\n\n"
              "- Windows (x64): Ravenai_1.0.0_x64-setup.exe（支持自动检测更新与一键静默升级）\n"
              "- macOS (Apple Silicon M1/M2/M3/M4): Ravenai_1.0.0_aarch64.dmg\n"
              "- macOS (Intel x64): Ravenai_1.0.0_x64.dmg\n"
              "- 核心功能：模型广场实时 TPS、渠道 6h 监测、GPT分组降智检测、模型指纹检测、API 密钥与用量分析、内置 Nova 生图平台、生态应用推荐\n"
              "- 安全加固：更新安装强制校验 SHA256（缺失或异常直接拒绝安装）、插件 API 密钥迁移至系统加密凭据库、Nova 前端依赖零已知漏洞\n"
              "- macOS 首次打开提示：未签名安装包若提示「已损坏」，在终端执行 xattr -cr /Applications/Ravenai.app 后即可打开\n\n"
              "SHA256SUMS:\n"
              f"{sums}\n"
          )
          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
          gh release edit "$TAG" -R "$GH_REPO" --title "Ravenai Desktop v1.00 ($TAG)" --notes-file release-notes.md

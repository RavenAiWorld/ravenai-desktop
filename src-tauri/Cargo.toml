[package]
name = "ravenai-desktop"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "ravenai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
oauth2 = { version = "5", default-features = false }
subtle = "2"
lmfpd = "0.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(not(windows))'.dependencies]
chacha20poly1305 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1

